<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 text-center mb-4">Iniciar sesión</h1>
          <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input id="username" class="form-control" formControlName="username" autocomplete="username">
              @if (formulario.controls.username.touched && formulario.controls.username.invalid) {
                <div class="text-danger small">Ingresa el usuario.</div>
              }
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input id="password" class="form-control" type="password" formControlName="password" autocomplete="current-password">
              @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
                <div class="text-danger small">Ingresa la contraseña.</div>
              }
            </div>
            @if (error()) { <div class="alert alert-danger" role="alert">{{ error() }}</div> }
            <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
              {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
